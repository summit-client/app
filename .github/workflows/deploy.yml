name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/summit-client
            export NODE_OPTIONS="--max-old-space-size=1024"

            echo "--> Syncing..."
            git checkout -- package-lock.json || true
            git pull origin main

            echo "--> Installing..."
            pnpm install

            echo "--> Clean build..."
            rm -rf apps/web/.next apps/scheduler/.next
            pnpm turbo build --filter=@summit/web --filter=@summit/scheduler

            echo "--> Verifying build output..."
            test -f apps/web/.next/server/pages/index.html
            test -d apps/scheduler/.next
            echo "Build output OK"

            echo "--> Restarting..."
            pm2 restart web scheduler
            pm2 save
            pm2 list