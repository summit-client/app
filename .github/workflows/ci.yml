name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      # ---- Security gates -------------------------------------------------
      # These fail the build. A control regression is not a warning: every one
      # of them corresponds to a way PHI has actually been exposed on this
      # schema before, or could be. See docs/compliance/README.md.

      - name: Security control register
        run: node supabase/tests/controls.mjs supabase/migrations

      - name: Data inventory — every table classified
        run: node supabase/tests/data-inventory.mjs supabase/migrations

      - name: Application-layer controls
        run: node supabase/tests/app-controls.mjs

      - name: RLS and tenant-isolation tests
        run: node supabase/tests/rls.mjs supabase/migrations

      - name: Database behaviour tests
        run: node supabase/tests/behaviour.mjs supabase/migrations

      # A migration that changes the security posture must also change the
      # committed matrix. Regenerating and diffing is what stops the matrix
      # becoming the kind of stale document this whole layer exists to avoid.
      - name: Compliance artefacts are up to date
        run: |
          # The date line differs on every run, so it is stripped before
          # comparing. Temp files rather than process substitution: the latter
          # is bash-only and fails under some sandboxes.
          strip() { grep -v '^Generated' "$1" > "$2"; }

          node supabase/tests/controls.mjs supabase/migrations --matrix > "$RUNNER_TEMP/matrix.md"
          strip "$RUNNER_TEMP/matrix.md" "$RUNNER_TEMP/matrix.stripped"
          strip docs/compliance/CONTROL_MATRIX.md "$RUNNER_TEMP/matrix.committed"
          if ! diff -u "$RUNNER_TEMP/matrix.committed" "$RUNNER_TEMP/matrix.stripped"; then
            echo "::error::CONTROL_MATRIX.md is stale. Regenerate it with:"
            echo "  node supabase/tests/controls.mjs supabase/migrations --matrix > docs/compliance/CONTROL_MATRIX.md"
            exit 1
          fi

          node supabase/tests/app-controls.mjs --matrix > "$RUNNER_TEMP/app.md"
          strip "$RUNNER_TEMP/app.md" "$RUNNER_TEMP/app.stripped"
          strip docs/compliance/APP_CONTROL_MATRIX.md "$RUNNER_TEMP/app.committed"
          if ! diff -u "$RUNNER_TEMP/app.committed" "$RUNNER_TEMP/app.stripped"; then
            echo "::error::APP_CONTROL_MATRIX.md is stale. Regenerate it with:"
            echo "  node supabase/tests/app-controls.mjs --matrix > docs/compliance/APP_CONTROL_MATRIX.md"
            exit 1
          fi

          node supabase/tests/data-inventory.mjs supabase/migrations --md > "$RUNNER_TEMP/inv.md"
          strip "$RUNNER_TEMP/inv.md" "$RUNNER_TEMP/inv.stripped"
          strip docs/compliance/DATA_INVENTORY.md "$RUNNER_TEMP/inv.committed"
          if ! diff -u "$RUNNER_TEMP/inv.committed" "$RUNNER_TEMP/inv.stripped"; then
            echo "::error::DATA_INVENTORY.md is stale. Regenerate it with:"
            echo "  node supabase/tests/data-inventory.mjs supabase/migrations --md > docs/compliance/DATA_INVENTORY.md"
            exit 1
          fi

      - name: Dependency vulnerability scan
        # Advisory rather than blocking, deliberately: a transitive advisory
        # with no patch would otherwise block every unrelated deploy, and a
        # gate people routinely override is worse than one that reports.
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Detect changed apps
        id: changes
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          for app in scheduler web data client employee; do
            if echo "$CHANGED" | grep -q "^apps/$app/\|^packages/"; then
              echo "${app}_changed=true" >> $GITHUB_OUTPUT
            else
              echo "${app}_changed=false" >> $GITHUB_OUTPUT
            fi
          done

      - name: Build scheduler
        if: steps.changes.outputs.scheduler_changed == 'true'
        run: pnpm --filter ./apps/scheduler build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build web
        if: steps.changes.outputs.web_changed == 'true'
        run: pnpm --filter ./apps/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build data
        # apps/data is a stub until the clinician portal merges: no build
        # script, so an unguarded `pnpm build` fails the whole run. Any change
        # under packages/ marks every app changed, which is how a scheduler-only
        # PR ended up trying to build it. Self-healing: builds once the script
        # exists.
        if: steps.changes.outputs.data_changed == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./apps/data/package.json').scripts && require('./apps/data/package.json').scripts.build ? 0 : 1)"; then
            pnpm --filter ./apps/data build
          else
            echo "::notice::apps/data has no build script (stub package) - skipping"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build client
        if: steps.changes.outputs.client_changed == 'true'
        run: pnpm --filter ./apps/client build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build employee
        # apps/employee is a stub until the employee hub merges: same guard as
        # apps/data above, for the same reason. Self-healing: builds once the
        # script exists. NOT in deploy.yml yet - it is added there when the app
        # is actually brought online (env file present, pm2 process started),
        # or `test -f .env.local` and `pm2 restart employee` fail every deploy.
        if: steps.changes.outputs.employee_changed == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./apps/employee/package.json').scripts && require('./apps/employee/package.json').scripts.build ? 0 : 1)"; then
            pnpm --filter ./apps/employee build
          else
            echo "::notice::apps/employee has no build script (stub package) - skipping"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
