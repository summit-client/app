name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared nav
        run: pnpm --filter ./packages/nav build

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Detect changed apps
        id: changes
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          for app in scheduler web data client; do
            if echo "$CHANGED" | grep -q "^apps/$app/\|^packages/"; then
              echo "${app}_changed=true" >> $GITHUB_OUTPUT
            else
              echo "${app}_changed=false" >> $GITHUB_OUTPUT
            fi
          done

      - name: Build scheduler
        if: steps.changes.outputs.scheduler_changed == 'true'
        run: pnpm --filter ./apps/scheduler build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build web
        if: steps.changes.outputs.web_changed == 'true'
        run: pnpm --filter ./apps/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build data
        # apps/data is a stub until the clinician portal merges: no build
        # script, so an unguarded `pnpm build` fails the whole run. Any change
        # under packages/ marks every app changed, which is how a scheduler-only
        # PR ended up trying to build it. Self-healing: builds once the script
        # exists.
        if: steps.changes.outputs.data_changed == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./apps/data/package.json').scripts && require('./apps/data/package.json').scripts.build ? 0 : 1)"; then
            pnpm --filter ./apps/data build
          else
            echo "::notice::apps/data has no build script (stub package) - skipping"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build client
        if: steps.changes.outputs.client_changed == 'true'
        run: pnpm --filter ./apps/client build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
