name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    # Bound once at the job, so the conditional below can actually test it.
    # A step-level `if: env.FOO` cannot see a secret bound inside that same
    # step - the condition is evaluated before the step's env exists.
    env:
      # SUPABASE_DB_URL is the one to set: a Postgres role that can connect and
      # read catalogs and holds no grant on a single table (supabase/tests/
      # README.md creates it). SUPABASE_ACCESS_TOKEN also works and is
      # ACCOUNT-WIDE with write access - anyone who can edit this file in a PR
      # can print a secret it binds. The suite prefers the first when both
      # are set.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.3

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      # Edge Functions are deployed separately and are covered by neither
      # `pnpm turbo build` nor any typecheck script, so their authorization
      # rules had no automated cover at all. Both suites read the rules out of
      # the functions' own source, so they cannot pass against a stale copy.
      # No credentials, no install - plain Node reading files.
      - name: Edge Function authorization
        run: |
          node supabase/tests/edit_teammate_authz.mjs
          node supabase/tests/invite_teammate_guard.mjs


      # The database suites. PGlite - a real Postgres compiled to WASM - so
      # these need no server, no Docker and no credentials. It is already
      # installed by the step below, which npm installs in the same directory;
      # `@electric-sql/pglite` is that directory's only dependency, so the
      # marginal cost of everything here is about 27 seconds.
      #
      # These GATE. That is deliberate, and the precedent is specific: rls.mjs
      # sat red from 0077 landing until 0086 - two cases asserting the exact
      # behaviour 0077 had removed - because nothing ran it. The PR that broke
      # it would have been stopped here. A migration-shaped change can break a
      # suite in an app-shaped PR, which is why these run on every PR rather
      # than only on ones touching supabase/.
      - name: Database suites (PGlite)
        run: |
          cd supabase/tests
          npm install --silent
          node apply.mjs ../migrations
          node behaviour.mjs ../migrations
          node rls.mjs ../migrations
          node session_type_id.mjs ../migrations
          node credential_verification.mjs ../migrations
          node session_note_completion.mjs ../migrations

          # The control register, the data inventory and the application-layer
          # controls: executed rather than written down, because a hand-kept
          # control matrix states what was true the day somebody wrote it and
          # this repo has already produced several stale claims of that kind.
          #
          # They run HERE, in this step, because controls.mjs and
          # data-inventory.mjs build a database from the migration files and so
          # need the PGlite installed above. Run from the repo root before that
          # install they fail with ERR_MODULE_NOT_FOUND - which is how they
          # failed the first time this was wired up.
          node controls.mjs ../migrations
          node data-inventory.mjs ../migrations
          node app-controls.mjs

      # ---------------------------------------------------------------------
      # Tenancy doctrine. Two runs, because they answer different questions.
      #
      # The first reads the migration files: no credentials, catches anything
      # WE write wrong, and cannot see the database. That limit is not
      # theoretical - on 2026-09-18 this exact check reported `sessions`
      # cleanly scoped while production carried two policies with no clinic
      # predicate that exist in no migration.
      #
      # The second reads production. It is the one that finds drift from any
      # source: a policy added in the Supabase dashboard, a migration run out
      # of order, anything older than this repo's history.
      # ---------------------------------------------------------------------
      - name: Tenancy doctrine (migration files)
        run: |
          cd supabase/tests
          npm install --silent
          node tenancy.mjs ../migrations

      # schema_drift runs here rather than with the PGlite suites above
      # because it needs the same live credential: it compares a database
      # built from the migration files against the real one, column by column.
      # 0000 GUESSES the scheduler's original tables - it reconstructs them
      # from application code - and two divergences were found by accident
      # before anything measured the whole thing.
      - name: Tenancy doctrine (live database)
        # Secrets are not available to workflow runs from forked repositories,
        # so this cannot run there. It is skipped rather than failed in that
        # case, and the step below turns the skip into a visible failure on
        # anything that is not a fork - a check that quietly does not run is
        # worse than no check, because it reads as a pass.
        if: ${{ env.SUPABASE_DB_URL != '' || env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          cd supabase/tests
          node tenancy.mjs ../migrations --live
          node schema_drift.mjs ../migrations

      - name: Fail if the live tenancy check did not run
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Neither SUPABASE_DB_URL nor SUPABASE_ACCESS_TOKEN is set, so the"
            echo "live tenancy check was skipped. The file-based check above passes"
            echo "on a database it cannot see - that is how two unscoped policies"
            echo "went unnoticed until 2026-09-18."
            echo
            echo "Add SUPABASE_DB_URL in Settings -> Secrets and variables -> Actions."
            echo "supabase/tests/README.md has the SQL that creates the scoped role."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Tenancy check ran on SUPABASE_ACCESS_TOKEN, which is account-wide and can write. Switch to SUPABASE_DB_URL - supabase/tests/README.md has the SQL."
          fi
          echo "Live tenancy check ran."

      - name: Detect changed apps
        id: changes
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          for app in scheduler web data client employee; do
            if echo "$CHANGED" | grep -q "^apps/$app/\|^packages/"; then
              echo "${app}_changed=true" >> $GITHUB_OUTPUT
            else
              echo "${app}_changed=false" >> $GITHUB_OUTPUT
            fi
          done

      - name: Build scheduler
        if: steps.changes.outputs.scheduler_changed == 'true'
        run: pnpm --filter ./apps/scheduler build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build web
        if: steps.changes.outputs.web_changed == 'true'
        run: pnpm --filter ./apps/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build data
        # apps/data is a stub until the clinician portal merges: no build
        # script, so an unguarded `pnpm build` fails the whole run. Any change
        # under packages/ marks every app changed, which is how a scheduler-only
        # PR ended up trying to build it. Self-healing: builds once the script
        # exists.
        if: steps.changes.outputs.data_changed == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./apps/data/package.json').scripts && require('./apps/data/package.json').scripts.build ? 0 : 1)"; then
            pnpm --filter ./apps/data build
          else
            echo "::notice::apps/data has no build script (stub package) - skipping"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build client
        if: steps.changes.outputs.client_changed == 'true'
        run: pnpm --filter ./apps/client build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build employee
        # apps/employee is a stub until the employee hub merges: same guard as
        # apps/data above, for the same reason. Self-healing: builds once the
        # script exists. NOT in deploy.yml yet - it is added there when the app
        # is actually brought online (env file present, pm2 process started),
        # or `test -f .env.local` and `pm2 restart employee` fail every deploy.
        if: steps.changes.outputs.employee_changed == 'true'
        shell: bash
        run: |
          if node -e "process.exit(require('./apps/employee/package.json').scripts && require('./apps/employee/package.json').scripts.build ? 0 : 1)"; then
            pnpm --filter ./apps/employee build
          else
            echo "::notice::apps/employee has no build script (stub package) - skipping"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
